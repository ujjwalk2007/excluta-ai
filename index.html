<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EXCLUTA AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080b12;
      --sidebar: #0a0d16;
      --surface: #0e1420;
      --surface2: #151c2e;
      --border: #1e2a42;
      --accent: #4f8ef7;
      --accent2: #7c5cfc;
      --glow: rgba(79,142,247,0.18);
      --text: #e8edf5;
      --text-muted: #5a6a8a;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: width 0.3s;
    }

    .sidebar-header {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #4f8ef7, #7c5cfc);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 14px var(--glow);
      flex-shrink: 0;
    }

    .logo-text {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1rem;
      background: linear-gradient(90deg, #4f8ef7, #7c5cfc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #new-chat-btn {
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(135deg, #4f8ef7, #7c5cfc);
      border: none;
      border-radius: 10px;
      color: white;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
      box-shadow: 0 0 14px var(--glow);
    }

    #new-chat-btn:hover { opacity: 0.85; }

    .sidebar-section-title {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 14px 16px 6px;
    }

    #chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    #chat-list::-webkit-scrollbar { width: 3px; }
    #chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      gap: 8px;
      group: true;
    }

    .chat-item:hover { background: var(--surface2); }
    .chat-item.active { background: var(--surface); border: 1px solid var(--border); }

    .chat-item-title {
      font-size: 0.82rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .chat-item.active .chat-item-title { color: var(--accent); }

    .chat-delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .chat-item:hover .chat-delete-btn { opacity: 1; }
    .chat-delete-btn:hover { color: #ff5a5a; }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* ===== MAIN ===== */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      background: rgba(14,20,32,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #current-chat-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-dot::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22d37a;
      box-shadow: 0 0 8px #22d37a;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .welcome {
      text-align: center;
      padding: 60px 20px;
      animation: fadeUp 0.6s ease;
    }

    .welcome h2 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #4f8ef7, #7c5cfc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .welcome p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }

    .welcome-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 24px;
    }

    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }

    .chip:hover { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.08); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 75%;
      animation: fadeUp 0.3s ease;
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.user .avatar {
      background: linear-gradient(135deg, #4f8ef7, #7c5cfc);
      box-shadow: 0 0 12px var(--glow);
    }

    .message.ai .avatar {
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .bubble {
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.65;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #4f8ef7, #7c5cfc);
      border-radius: 14px 4px 14px 14px;
      color: #fff;
      box-shadow: 0 4px 18px rgba(79,142,247,0.22);
    }

    .message.ai .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px 14px 14px 14px;
      color: var(--text);
    }

    .thinking {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 13px 16px;
    }

    .thinking span {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .input-area {
      padding: 14px 24px 18px;
      background: rgba(8,11,18,0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }

    #input::placeholder { color: var(--text-muted); }

    #btn {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #4f8ef7, #7c5cfc);
      border: none;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 0 12px var(--glow);
    }

    #btn:hover { opacity: 0.85; transform: scale(1.05); }
    #btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #btn svg { width: 17px; height: 17px; fill: white; }

    .input-hint {
      text-align: center;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .empty-history {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 20px 16px;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="logo-row">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">EXCLUTA AI</div>
      </div>
      <button id="new-chat-btn">
        <span>✏️</span> New Chat
      </button>
    </div>
    <div class="sidebar-section-title">Recent Chats</div>
    <div id="chat-list"></div>
    <div class="sidebar-footer">Powered by DeepSeek R1 • Local</div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <header>
      <div id="current-chat-title">New Chat</div>
      <div class="status-dot">Online</div>
    </header>

    <div id="chat">
      <div class="welcome" id="welcome">
        <h2>Namaste! Main hoon EXCLUTA AI 👋</h2>
        <p>Kuch bhi pucho — math, coding, science, ya general knowledge.</p>
        <div class="welcome-chips">
          <div class="chip" onclick="quickSend('2x + 5 = 15, x kya hai?')">🔢 Math solve karo</div>
          <div class="chip" onclick="quickSend('Python mein for loop kaise likhte hain?')">💻 Coding help</div>
          <div class="chip" onclick="quickSend('Water cycle explain karo')">🌍 Science</div>
          <div class="chip" onclick="quickSend('tum kaun ho?')">🤖 Tum kaun ho?</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="input" placeholder="Kuch bhi pucho..." rows="1"></textarea>
        <button id="btn">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
      <div class="input-hint">Enter to send • Shift+Enter for new line</div>
    </div>
  </div>

  <script>
    // ===== STATE =====
    let conversations = JSON.parse(localStorage.getItem('excluta_convos') || '{}');
    let currentId = null;

    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const btnEl = document.getElementById('btn');
    const chatListEl = document.getElementById('chat-list');
    const welcomeEl = document.getElementById('welcome');
    const titleEl = document.getElementById('current-chat-title');

    // ===== SAVE =====
    function save() {
      localStorage.setItem('excluta_convos', JSON.stringify(conversations));
    }

    // ===== RENDER SIDEBAR =====
    function renderSidebar() {
      const ids = Object.keys(conversations).reverse();
      if (ids.length === 0) {
        chatListEl.innerHTML = '<div class="empty-history">Koi purani chat nahi</div>';
        return;
      }
      chatListEl.innerHTML = ids.map(id => `
        <div class="chat-item ${id === currentId ? 'active' : ''}" onclick="loadChat('${id}')">
          <span class="chat-item-title">${conversations[id].title}</span>
          <button class="chat-delete-btn" onclick="deleteChat(event, '${id}')">🗑</button>
        </div>
      `).join('');
    }

    // ===== NEW CHAT =====
    function newChat() {
      currentId = null;
      chatEl.innerHTML = '';
      chatEl.appendChild(welcomeEl);
      welcomeEl.style.display = 'block';
      titleEl.textContent = 'New Chat';
      renderSidebar();
    }

    // ===== LOAD CHAT =====
    function loadChat(id) {
      currentId = id;
      const convo = conversations[id];
      titleEl.textContent = convo.title;
      welcomeEl.style.display = 'none';
      chatEl.innerHTML = '';

      convo.messages.forEach(msg => {
        appendBubble(msg.text, msg.role, false);
      });

      renderSidebar();
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // ===== DELETE CHAT =====
    function deleteChat(e, id) {
      e.stopPropagation();
      delete conversations[id];
      save();
      if (currentId === id) newChat();
      else renderSidebar();
    }

    // ===== APPEND BUBBLE =====
    function appendBubble(text, role, animate = true) {
      welcomeEl.style.display = 'none';

      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      if (!animate) msg.style.animation = 'none';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '👤' : '⚡';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      chatEl.appendChild(msg);
      chatEl.scrollTop = chatEl.scrollHeight;
      return bubble;
    }

    function addThinking() {
      welcomeEl.style.display = 'none';
      const msg = document.createElement('div');
      msg.className = 'message ai';
      msg.id = 'thinking-msg';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '⚡';

      const bubble = document.createElement('div');
      bubble.className = 'bubble thinking';
      bubble.innerHTML = '<span></span><span></span><span></span>';

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      chatEl.appendChild(msg);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function removeThinking() {
      const t = document.getElementById('thinking-msg');
      if (t) t.remove();
    }

    // ===== SEND MESSAGE =====
    async function sendMessage() {
      const msg = inputEl.value.trim();
      if (!msg || btnEl.disabled) return;

      // Create new conversation if needed
      if (!currentId) {
        currentId = 'chat_' + Date.now();
        conversations[currentId] = {
          title: msg.slice(0, 35) + (msg.length > 35 ? '...' : ''),
          messages: []
        };
        titleEl.textContent = conversations[currentId].title;
      }

      // Save user message
      conversations[currentId].messages.push({ role: 'user', text: msg });
      save();
      appendBubble(msg, 'user');
      inputEl.value = '';
      inputEl.style.height = 'auto';
      btnEl.disabled = true;
      addThinking();
      renderSidebar();

      try {
        const res = await fetch('https://excluta-ai-production.up.railway.app/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        });

        const data = await res.json();
        removeThinking();

        let reply = data.reply || 'Koi response nahi mila.';
        reply = reply.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();

        conversations[currentId].messages.push({ role: 'ai', text: reply });
        save();
        appendBubble(reply, 'ai');

      } catch (err) {
        removeThinking();
        appendBubble('❌ Server se connect nahi ho paya. Kya node server.js chal raha hai?', 'ai');
      } finally {
        btnEl.disabled = false;
        inputEl.focus();
      }
    }

    function quickSend(text) {
      inputEl.value = text;
      sendMessage();
    }

    // ===== EVENTS =====
    document.getElementById('new-chat-btn').addEventListener('click', newChat);

    btnEl.addEventListener('click', sendMessage);

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ===== INIT =====
    renderSidebar();
  </script>
</body>
</html>
